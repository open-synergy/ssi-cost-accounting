scenarios:
  - name: "Optional policy - no analytic account - create succeeds"
    steps:
      - step: "Create optional-policy account"
        action: "create"
        model: "account.account"
        save_as: "acc1"
        values:
          name: "Optional Account 1"
          code: "CA9911"
          user_type_id: "account.data_account_type_expenses"
          company_id: "REC: company.id"

      - step: "Create counterpart account"
        action: "create"
        model: "account.account"
        save_as: "cc1"
        values:
          name: "Counterpart Account 1"
          code: "CC9911"
          user_type_id: "account.data_account_type_expenses"
          company_id: "REC: company.id"

      - step: "Create general journal"
        action: "create"
        model: "account.journal"
        save_as: "journal1"
        values:
          name: "Test Journal 1"
          code: "TJ911"
          type: "general"
          company_id: "REC: company.id"

      - step: "Create move without analytic account"
        action: "create"
        model: "account.move"
        save_as: "move1"
        values:
          move_type: "entry"
          journal_id: "REC: journal1.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc1.id"
                debit: 100.0
                credit: 0.0
                name: "Main line"
            - - 0
              - 0
              - account_id: "REC: cc1.id"
                debit: 0.0
                credit: 100.0
                name: "Counterpart line"

      - step: "Assert move created in draft"
        action: "assert"
        target: "move1"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

