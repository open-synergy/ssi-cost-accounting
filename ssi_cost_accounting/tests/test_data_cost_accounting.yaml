scenarios:
  - name: "Analytic Group - Create with default sequence"
    steps:
      - step: "Create analytic group"
        action: "create"
        model: "account.analytic.group"
        save_as: "group"
        values:
          name: "Test Analytic Group CA"

      - step: "Assert group name and default sequence"
        action: "assert"
        target: "group"
        asserts:
          name:
            type: "value"
            expected: "Test Analytic Group CA"
          sequence:
            type: "value"
            expected: 10

  - name: "Analytic Group - Create with custom sequence"
    steps:
      - step: "Create analytic group with sequence 5"
        action: "create"
        model: "account.analytic.group"
        save_as: "group"
        values:
          name: "Test Group Seq 5 CA"
          sequence: 5

      - step: "Assert custom sequence"
        action: "assert"
        target: "group"
        asserts:
          sequence:
            type: "value"
            expected: 5

  - name: "Analytic Account - Create with default state"
    steps:
      - step: "Create analytic account"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_acc"
        values:
          name: "Test Analytic Account CA"

      - step: "Assert default state is draft"
        action: "assert"
        target: "analytic_acc"
        asserts:
          name:
            type: "value"
            expected: "Test Analytic Account CA"
          state:
            type: "value"
            expected: "draft"

  - name: "Analytic Account - Create with group"
    steps:
      - step: "Create analytic group"
        action: "create"
        model: "account.analytic.group"
        save_as: "group"
        values:
          name: "Test Parent Group CA"
          sequence: 20

      - step: "Create analytic account in group"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_acc"
        values:
          name: "Test Analytic In Group CA"
          group_id: "EVAL: registry['group'].id"

      - step: "Assert account has group and draft state"
        action: "assert"
        target: "analytic_acc"
        asserts:
          group_id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  - name: "Analytic Account - With date range"
    steps:
      - step: "Create analytic account with dates"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_acc"
        values:
          name: "Test Analytic With Dates CA"
          date_start: 2024-01-01
          date_end: 2024-12-31

      - step: "Assert date fields are set"
        action: "assert"
        target: "analytic_acc"
        asserts:
          date_start:
            type: "value"
            operator: "is_truthy"
          date_end:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  - name: "Analytic Account - Parent-child hierarchy coexists with SSI fields"
    steps:
      - step: "Create analytic group for hierarchy"
        action: "create"
        model: "account.analytic.group"
        save_as: "hierarchy_group"
        values:
          name: "Test Hierarchy Group CA"

      - step: "Create parent analytic account in the group"
        action: "create"
        model: "account.analytic.account"
        save_as: "parent_acc"
        values:
          name: "Test Parent Analytic CA"
          group_id: "REC: hierarchy_group.id"

      - step: "Create child analytic account under the parent"
        action: "create"
        model: "account.analytic.account"
        save_as: "child_acc"
        values:
          name: "Test Child Analytic CA"
          parent_id: "REC: parent_acc.id"
          group_id: "REC: hierarchy_group.id"

      - step: "Assert child keeps OCA hierarchy and SSI defaults"
        action: "assert"
        target: "child_acc"
        asserts:
          parent_id:
            type: "m2o"
            expected: "REC: parent_acc"
          complete_name:
            type: "value"
            expected: "Test Parent Analytic CA / Test Child Analytic CA"
          state:
            type: "value"
            expected: "draft"
          group_id:
            type: "m2o"
            expected: "REC: hierarchy_group"

  - name: "Analytic Account - Self-parenting is rejected"
    steps:
      - step: "Create analytic account for the recursion check"
        action: "create"
        model: "account.analytic.account"
        save_as: "self_acc"
        values:
          name: "Test Self Parent CA"

      - step: "Writing parent_id to itself must raise UserError"
        action: "write"
        target: "self_acc"
        expect_error:
          type: "UserError"
        values:
          parent_id: "REC: self_acc.id"
